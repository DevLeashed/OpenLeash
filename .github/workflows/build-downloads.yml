# On-demand downloads; optional updater signing. Never creates tags or releases.
name: Build downloads

on:
  workflow_dispatch:
    inputs:
      build_updater:
        description: Build signed updater extras (requires Tauri signing secrets)
        type: boolean
        default: false
      release_tag:
        description: Release tag for updater URLs (blank = package version, no v)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: none
          # VS 2022 on this image includes VC.Tools.ARM64 and ARM64 SDK libs.
          # Cross-compile the portable executable on the x64 host.
          - label: windows-arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: none
          # Keep genuine build failures visible, without cancelling other targets.
          - label: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Native ARM libraries; intentionally no ARM AppImage tooling assumption.
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_LABEL: ${{ matrix.label }}
      BUILD_BUNDLES: ${{ matrix.bundles }}
      BUILD_UPDATER: ${{ inputs.build_updater }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev \
            libxkbcommon-dev libpipewire-0.3-dev libspa-0.2-dev \
            clang libclang-dev libgbm-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev \
            libxi-dev libxtst-dev patchelf libfuse2

      - name: Verify PipeWire and SPA header versions
        if: runner.os == 'Linux'
        run: |
          pkg-config --atleast-version=1.0.0 libpipewire-0.3 || {
            echo "libpipewire-0.3 headers 1.0.0 or newer are required by the locked PipeWire bindings" >&2
            exit 1
          }
          pkg-config --atleast-version=0.2 libspa-0.2 || {
            echo "libspa-0.2 headers implementing the SPA 0.2 API are required by the locked libspa bindings" >&2
            exit 1
          }
          printf 'PipeWire %s; SPA API %s\n' \
            "$(pkg-config --modversion libpipewire-0.3)" \
            "$(pkg-config --modversion libspa-0.2)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check app version metadata
        run: npm run version:check

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: downloads-${{ matrix.target }}

      - name: Validate release identity
        run: python -B -c 'import json, os, sys; sys.path.insert(0, "scripts"); from updater_assets import release_identity; release_identity(json.load(open("package.json"))["version"], os.environ["RELEASE_TAG"])'

      - name: Build unsigned downloads
        if: ${{ !inputs.build_updater || matrix.label == 'linux-arm64' }}
        # The first -- is npm's separator; the second forwards --locked to Cargo.
        # Tauri also runs beforeBuildCommand (TypeScript + production Vite build).
        run: |
          if [ "$BUILD_BUNDLES" = none ]; then
            npm run tauri -- build --ci --no-sign --target "$BUILD_TARGET" --no-bundle -- --locked
          else
            npm run tauri -- build --ci --no-sign --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked
          fi

      - name: Build updater-signed downloads
        if: inputs.build_updater && matrix.label != 'linux-arm64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # --no-sign skips updater signatures too, so MUST NOT be used here.
        # Updater signing is distinct from Authenticode / Apple notarization.
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Set TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before opting in.' >&2
            exit 1
          fi
          bundles="$BUILD_BUNDLES"
          if [ "$bundles" = none ]; then bundles=nsis; fi
          npm run tauri -- build --ci --target "$BUILD_TARGET" \
            --config "$GITHUB_WORKSPACE/src-tauri/tauri.updater.conf.json" \
            --bundles "$bundles" -- --locked

      - name: Test download staging
        run: |
          python -B scripts/test-stage-downloads.py
          python -B scripts/test-updater.py

      - name: Stage release-named downloads
        id: downloads
        run: |
          python scripts/stage-downloads.py
          if [ "$BUILD_UPDATER" = true ]; then
            python -B -c 'import json, os; from scripts.updater_assets import release_identity; version=json.load(open("package.json"))["version"]; tag=release_identity(version, os.environ.get("RELEASE_TAG", "")); print("Validated updater release tag:", tag)'
          fi

      # Each artifact ZIP contains exactly one file at its root.
      - name: Upload primary download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.downloads.outputs.file_1 }}
          path: downloads/${{ steps.downloads.outputs.file_1 }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Upload secondary download or updater installer
        if: steps.downloads.outputs.file_2 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.downloads.outputs.file_2 }}
          path: downloads/${{ steps.downloads.outputs.file_2 }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Upload updater signature or fragment
        if: steps.downloads.outputs.file_3 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.downloads.outputs.file_3 }}
          path: downloads/${{ steps.downloads.outputs.file_3 }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Upload updater metadata fragment
        if: steps.downloads.outputs.file_4 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.downloads.outputs.file_4 }}
          path: downloads/${{ steps.downloads.outputs.file_4 }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  updater-manifest:
    name: Assemble updater manifest (no publishing)
    if: inputs.build_updater
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download single-file artifacts
        # gh extracts into separate named directories; no ZIPs are nested in latest.json.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --dir extracted
      - name: Assemble static latest.json
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          python -B scripts/assemble-updater.py extracted --version "$version" --release-tag "$RELEASE_TAG"
      - name: Upload single-file updater manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest.json
          path: latest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
