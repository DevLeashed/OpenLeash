name: Bug report
description: Something in OpenLeash doesn't work the way it should
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Open a private advisory
        instead — see [SECURITY.md](https://github.com/DevLeashed/OpenLeash/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The agent ran `npm install` even though I set the permission mode to `ask`.
        I expected a permission prompt first.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How someone else can see it too.
      placeholder: |
        1. Set permission mode to `ask`
        2. Start a task and ask it to install a dependency
        3. No prompt appears
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Chat context
      description: |
        If the bug involves the agent doing something, this helps a lot:
        the provider and model, the permission mode, and the relevant part of the
        transcript (or `~/.openleash/tasks/<id>.json` with keys redacted).
      render: markdown
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OpenLeash version
      description: Shown in Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### If this involves the agent running commands

        A reproduction can be destructive by definition. Please run it against a
        throwaway VM or a scoped directory, and never paste a live API key,
        OAuth token, or `settings.json` into the issue.